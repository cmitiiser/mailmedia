name: Auto-Index Club Logos

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'ClubLogos/**'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ClubLogos index.json
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const targetDir = "./ClubLogos";
            if (!fs.existsSync(targetDir)) {
              console.error("Directory not found:", targetDir);
              process.exit(1);
            }

            const allEntries = fs.readdirSync(targetDir, { recursive: true });
            
            const validExts = [".svg", ".png", ".jpg", ".jpeg", ".webp", ".pdf"];
            
            const files = allEntries.filter(entry => {
              const fullPath = path.join(targetDir, entry);
              if (fs.statSync(fullPath).isDirectory()) return false;
              const ext = path.extname(entry).toLowerCase();
              return validExts.includes(ext) && !path.basename(entry).startsWith(".");
            });

            console.log("Discovered files:", files);

            const repoOwner = "cmitiiser";
            const repoName = "mailmedia";
            const branch = "main";
            const rawBase = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branch}/ClubLogos`;

            const clubs = {};

            files.forEach(relPath => {
              const normalizedPath = relPath.replace(/\\/g, "/");
              const ext = path.extname(normalizedPath).replace(".", "").toLowerCase();
              
              const parts = normalizedPath.split("/");
              let rawKey = parts.length > 1 ? parts[0] : path.basename(normalizedPath, path.extname(normalizedPath));

              const cleanTitle = rawKey
                .replace(/[-_]/g, " ")
                .replace(/\b\w/g, c => c.toUpperCase());

              if (!clubs[rawKey]) {
                clubs[rawKey] = {
                  id: rawKey,
                  name: cleanTitle,
                  files: {}
                };
              }

              const urlParts = normalizedPath.split("/").map(encodeURIComponent).join("/");
              clubs[rawKey].files[ext] = `${rawBase}/${urlParts}`;
            });

            const result = Object.values(clubs).sort((a, b) => a.name.localeCompare(b.name));
            const outPath = path.join(targetDir, "index.json");
            fs.writeFileSync(outPath, JSON.stringify(result, null, 2));
            console.log(`Successfully generated ${outPath} with ${result.length} clubs.`);
          '

      - name: Commit and Push Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ClubLogos/index.json
          git diff --staged --quiet || (git commit -m "chore: auto-update ClubLogos index.json [skip ci]" && git push)
